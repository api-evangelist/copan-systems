name: Copan Systems
description: Copan Systems was an enterprise data-storage company founded in 2002 and based in Longmont,
  Colorado, known for pioneering MAID (Massive Array of Idle Disks) technology for long-term persistent
  and archival storage. Its Enterprise MAID architecture powered down idle disks to cut power, cooling,
  and floor-space costs in the data center. Backed by Battery Ventures and other investors, the company
  raised more than $100 million in venture funding before filing for bankruptcy in 2009; SGI acquired its
  assets in 2010 (that storage lineage now sits within Hewlett Packard Enterprise). The company is
  defunct and operates no public developer surface, API, or documentation, so there is nothing to
  enrich in the API Evangelist artifact pipeline.
